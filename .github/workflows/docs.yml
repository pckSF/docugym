name: Docs Quality

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - README.md
      - mkdocs.yml
      - scripts/check_markdown_links.py
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - README.md
      - mkdocs.yml
      - scripts/check_markdown_links.py
      - .github/workflows/docs.yml

permissions:
  contents: read

jobs:
  docs-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Check local Markdown links
        run: python3 scripts/check_markdown_links.py docs README.md

      - name: Build docs with MkDocs (strict)
        run: uv tool run --from mkdocs==1.6.1 mkdocs build --strict
