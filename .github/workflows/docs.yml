name: Docs Quality

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - README.md
      - mkdocs.yml
      - scripts/check_markdown_links.py
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - README.md
      - mkdocs.yml
      - scripts/check_markdown_links.py
      - .github/workflows/docs.yml

permissions:
  contents: read

jobs:
  docs-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Check local Markdown links
        run: python3 scripts/check_markdown_links.py docs README.md

      - name: Build docs with MkDocs (strict)
        run: uv tool run --from mkdocs==1.6.1 mkdocs build --strict
