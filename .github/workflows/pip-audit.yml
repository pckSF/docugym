name: Dependency CVE Audit

on:
  push:
    branches: [main]
    paths:
      - requirements.txt
      - uv.lock
      - pyproject.toml
      - .github/workflows/pip-audit.yml
  pull_request:
    paths:
      - requirements.txt
      - uv.lock
      - pyproject.toml
      - .github/workflows/pip-audit.yml
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Run pip-audit against lock-derived requirements
        run: |
          uv tool run --from pip-audit==2.9.0 pip-audit \
            -r requirements.txt \
            --disable-pip
