[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "docugym"
version = "0.1.0"
description = "Local live nature-documentary-style narrator for Gymnasium environments"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "ale-py>=0.11,<1",
  "box2d>=2.3,<3",
  "gym>=0.26,<1",
  "gymnasium>=1.2,<2.0",
  "huggingface-hub>=0.36,<2",
  "huggingface-sb3>=3.0,<4",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pillow>=12.2.0,<13",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "pygame>=2.6,<3",
  "pyyaml>=6.0,<7",
  "shimmy>=2.0,<3",
  "stable-baselines3>=2.3,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
voice = [
  "kokoro>=0.9,<1",
  "sounddevice>=0.5,<1",
  "soundfile>=0.13,<1",
]
vlm = [
  "vllm>=0.10,<1",
]

[project.scripts]
docugym = "docugym.cli:app"

[tool.hatch.build.targets.sdist]
include = [
  "/cdoc",
  "/configs",
  "/docs",
  "/docugym",
  "/tests",
  "/README.md",
  "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["docugym"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "docugym/configs"

[dependency-groups]
dev = [
  "pre-commit>=4.0,<5",
  "pytest>=9.0.3,<10",
  "ruff>=0.15,<1",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
  # pyflakes
  "F",
  # pycodestyle
  "E", "W",
  # flake8-2020
  "YTT",
  # flake8-bugbear
  "B",
  # flake8-quotes
  "Q",
  # pylint
  "PLE", "PLR", "PLW",
  # misc lints
  "PIE",
  # flake8-pyi
  "PYI",
  # tidy imports
  "TID",
  # implicit string concatenation
  "ISC",
  # flake8-type-checking
  "TC",
  # comprehensions
  "C4",
]

ignore = [
  # Typer command definitions intentionally use typer.Option(...) defaults.
  "B008",
  # Optional-import checks and module shims use constant getattr/setattr names.
  "B009",
  "B010",
  # CLI, display, and orchestration entry points remain parameter-rich by design.
  "PLR0912",
  "PLR0913",
  "PLR0915",
  # Rendering math, tests, and protocol constants use local literal values.
  "PLR2004",
]


[tool.isort]
# Keep import wrapping compatible with Ruff's Black-style formatter.
profile = "black"
combine_as_imports = true
force_sort_within_sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
